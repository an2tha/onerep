name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, onerep-prod]
    timeout-minutes: 30
    env:
      VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
      VITE_CONVEX_SITE_URL: ${{ secrets.VITE_CONVEX_SITE_URL }}
      VITE_SITE_URL: https://onerep.life
      VITE_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.VITE_PUBLIC_POSTHOG_PROJECT_TOKEN }}
      VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_HOST }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run test:convex
      - run: bun audit --audit-level high
      - run: bun run build

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: onerep-web-dist
          path: apps/web/dist
          if-no-files-found: error

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: onerep-app-dist
          path: apps/mobile/dist
          if-no-files-found: error

  deploy:
    runs-on: [self-hosted, onerep-prod]
    needs: build
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: onerep-web-dist
          path: /tmp/onerep-build/web

      - name: Download app artifact
        uses: actions/download-artifact@v4
        with:
          name: onerep-app-dist
          path: /tmp/onerep-build/app

      - name: Install Docker Compose
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL https://github.com/docker/compose/releases/download/v2.40.3/docker-compose-linux-x86_64 -o ~/.docker/cli-plugins/docker-compose
          chmod +x ~/.docker/cli-plugins/docker-compose
          docker compose version

      - name: Deploy static assets
        run: |
          set -euo pipefail
          install -d /data/onerep/web /data/onerep/app
          find /data/onerep/web -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          find /data/onerep/app -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a /tmp/onerep-build/web/. /data/onerep/web/
          cp -a /tmp/onerep-build/app/. /data/onerep/app/
          install -m 0644 nginx-web.conf /data/onerep/nginx-web.conf
          install -m 0644 nginx-app.conf /data/onerep/nginx-app.conf
          install -m 0644 docker-compose.yml /data/onerep/docker-compose.yml
          docker compose -f /data/onerep/docker-compose.yml config >/dev/null
          docker compose -f /data/onerep/docker-compose.yml up -d --remove-orphans
          curl -fsS -H 'Host: onerep.life' http://coolify-proxy/health
          curl -fsS -H 'Host: app.onerep.life' http://coolify-proxy/health
