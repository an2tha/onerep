version: 52
jobs:
  - name: Deploy Cloudflare Pages
    steps:
      - type: CheckoutStep
        name: Checkout repository
        cloneCredential:
          type: DefaultCredential
        withLfs: false
        withSubmodules: false
        cloneDepth: 1
        condition: SUCCESSFUL
        optional: false
      - type: CommandStep
        name: Install dependencies
        runInContainer: true
        image: oven/bun:1.3.4
        interpreter:
          type: PosixInterpreter
          shell: sh
          commands: |
            set -eu
            bun install --frozen-lockfile
        runAs: 0:0
        useTTY: false
        condition: SUCCESSFUL
        optional: false
      - type: CommandStep
        name: Run tests
        runInContainer: true
        image: oven/bun:1.3.4
        interpreter:
          type: PosixInterpreter
          shell: sh
          commands: |
            set -eu
            bun run prompts:check
            bun run turbo run typecheck
            # apps/mobile is deliberately excluded: it has 11 pre-existing
            # UI-contract failures (Coach tabs, onboarding steps, dashboard
            # copy) that predate this job. Add --filter=mobile here once those
            # are fixed, so the gate covers the whole repo.
            bun run turbo run test --filter=datasource --filter=@@repo/ui --filter=@@repo/models --filter=web
            bun run test:convex
        runAs: 0:0
        useTTY: false
        condition: SUCCESSFUL
        optional: false
      # Ships the backend to the deployment the app actually talks to.
      #
      # `convex deploy` cannot target a dev deployment (it only reaches prod or
      # preview deployments), and the live app runs on the dev deployment
      # hallowed-llama-854 -- so this uses `convex dev --once`, which pushes
      # code and stops instead of watching for changes.
      #
      # CONVEX_ACCESS_TOKEN is a personal Convex account token, not a
      # deployment-scoped deploy key: it can reach every project on the
      # account. Narrow this to a production deploy key if the app is ever
      # migrated onto the prod deployment.
      - type: CommandStep
        name: Deploy Convex functions
        runInContainer: true
        image: oven/bun:1.3.4
        interpreter:
          type: PosixInterpreter
          shell: sh
          commands: |
            set -eu
            bunx convex dev --once
        runAs: 0:0
        envVars:
          - name: CONVEX_DEPLOYMENT
            value: "@secret:DEV_CONVEX_DEPLOYMENT@"
          - name: CONVEX_OVERRIDE_ACCESS_TOKEN
            value: "@secret:CONVEX_ACCESS_TOKEN@"
        useTTY: false
        condition: SUCCESSFUL
        optional: false
      - type: CommandStep
        name: Build static sites
        runInContainer: true
        image: oven/bun:1.3.4
        interpreter:
          type: PosixInterpreter
          shell: sh
          commands: |
            set -eu
            # --mode development is required, not an oversight: apps/mobile
            # vite.config.ts refuses a production-mode build when
            # CONVEX_DEPLOYMENT starts with "dev:", and the live app runs on
            # the dev deployment hallowed-llama-854. The shipped bundle
            # therefore keeps import.meta.env.DEV true. Drop this flag only
            # once the app moves to the prod deployment.
            bun run turbo run build --filter=mobile --filter=web -- --mode development
        runAs: 0:0
        envVars:
          # NOTE: the DEV_* prefix is historical. These point at the Convex
          # deployment that serves production traffic and holds all real user
          # data. The deployment literally named "prod" is empty. Do not
          # "correct" these to a prod deployment without migrating data first.
          - name: CONVEX_DEPLOYMENT
            value: "@secret:DEV_CONVEX_DEPLOYMENT@"
          - name: VITE_CONVEX_URL
            value: "@secret:DEV_VITE_CONVEX_URL@"
          - name: VITE_CONVEX_SITE_URL
            value: "@secret:DEV_VITE_CONVEX_SITE_URL@"
          - name: VITE_APP_URL
            value: https://app.onerep.life
        useTTY: false
        condition: SUCCESSFUL
        optional: false
      - type: CommandStep
        name: Deploy mobile app
        runInContainer: true
        image: oven/bun:1.3.4
        interpreter:
          type: PosixInterpreter
          shell: sh
          commands: |
            set -eu
            bunx wrangler@@4 pages deploy apps/mobile/dist --project-name=onerep-mobile --branch=main
        runAs: 0:0
        envVars:
          - name: CLOUDFLARE_API_TOKEN
            value: "@secret:CLOUDFLARE_API_TOKEN@"
          - name: CLOUDFLARE_ACCOUNT_ID
            value: "@secret:CLOUDFLARE_ACCOUNT_ID@"
        useTTY: false
        condition: SUCCESSFUL
        optional: false
      - type: CommandStep
        name: Deploy marketing site
        runInContainer: true
        image: oven/bun:1.3.4
        interpreter:
          type: PosixInterpreter
          shell: sh
          commands: |
            set -eu
            bunx wrangler@@4 pages deploy apps/web/dist --project-name=onerep-web --branch=main
        runAs: 0:0
        envVars:
          - name: CLOUDFLARE_API_TOKEN
            value: "@secret:CLOUDFLARE_API_TOKEN@"
          - name: CLOUDFLARE_ACCOUNT_ID
            value: "@secret:CLOUDFLARE_ACCOUNT_ID@"
        useTTY: false
        condition: SUCCESSFUL
        optional: false
    triggers:
      - type: BranchUpdateTrigger
        branches: main
        userMatch: anyone
    sequentialGroup: "@project_path@:cloudflare-pages-production"
    retryCondition: never
    timeout: 3600
