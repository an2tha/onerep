# Self-hosted OneRep: the whole public stack in one file.
#
#   backend        Convex (database, functions, auth, crons) — the whole backend
#   dashboard      Convex dashboard, so you can see what the backend is doing
#   datasource     USDA food + wger exercise search (Bun + SQLite), Convex-only,
#                  never exposed to the host — Convex reaches it on the compose
#                  network as http://datasource:3100
#   app            The OneRep client (responsive web app / PWA), static files
#   convex-deploy  One-shot: deploys Convex functions, then exits. Not part of
#                  `docker compose up` (profile: deploy) — install.sh runs it.
#
# The marketing site and private billing are deliberately absent; this mirrors
# scripts/public-exclude.txt. Billing is stubbed and every account has Pro by
# default, which is the self-hosting answer.
#
# datasource and app pull prebuilt images from GHCR by default — no bun/node
# and no multi-minute app build on the host. That only covers the default
# 127.0.0.1 setup: VITE_CONVEX_URL/VITE_APP_URL/etc. are baked into the app's
# JS bundle at image-build time, not read at runtime. Serving on a real domain
# means building locally instead — see docker-compose.build.yml.
#
# Run ./install.sh instead of `docker compose up` the first time: the backend
# needs an admin key generated and functions deployed before the app is useful.

name: onerep-selfhost

services:
  backend:
    image: ghcr.io/get-convex/convex-backend:latest
    stop_grace_period: 10s
    environment:
      - INSTANCE_NAME=${CONVEX_INSTANCE_NAME:-onerep}
      - INSTANCE_SECRET=${CONVEX_INSTANCE_SECRET:?run install.sh to generate .env}
      # The URLs clients use to reach this backend. Change them in .env if the
      # host is not localhost, then rebuild the app (they are baked in).
      - CONVEX_CLOUD_ORIGIN=${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:3210}
      - CONVEX_SITE_ORIGIN=${CONVEX_SITE_ORIGIN:-http://127.0.0.1:3211}
      - DISABLE_BEACON=${CONVEX_DISABLE_BEACON:-true}
    ports:
      - "3210:3210" # Convex client API
      - "3211:3211" # HTTP actions (v1 API, MCP, webhooks)
    volumes:
      - convex-data:/convex/data
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:3210}
    ports:
      - "6791:6791"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  datasource:
    image: ${DATASOURCE_IMAGE:-ghcr.io/an2tha/onerep-datasource:latest}
    environment:
      - API_TOKEN=${DATASOURCE_API_TOKEN:?run install.sh to generate .env}
    # No host port on purpose: Convex is the only client this service has ever
    # had, and the compose network is as far as it needs to travel.
    expose:
      - "3100"
    volumes:
      - datasource-data:/data
    healthcheck:
      test: wget -qO- http://localhost:3100/health
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  app:
    image: ${APP_IMAGE:-ghcr.io/an2tha/onerep-app:latest}
    ports:
      - "8081:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # One-shot: deploys Convex functions and sets deployment env vars, then
  # exits. `docker compose run --rm convex-deploy` — install.sh does this so
  # nothing on the host needs bun or node. Never starts with `up`.
  convex-deploy:
    image: ${CONVEX_DEPLOY_IMAGE:-ghcr.io/an2tha/onerep-convex-deploy:latest}
    profiles: ["deploy"]
    environment:
      # Talks to the backend over the compose network, not the host-published
      # port — CONVEX_CLOUD_ORIGIN is what clients use and may not even be
      # reachable from inside this container (e.g. a public domain in front
      # of a reverse proxy that isn't running yet).
      - CONVEX_SELF_HOSTED_URL=http://backend:3210
      - CONVEX_SELF_HOSTED_ADMIN_KEY=${CONVEX_SELF_HOSTED_ADMIN_KEY:?run install.sh}
      - APP_URL=${APP_URL:-http://127.0.0.1:8081}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?run install.sh to generate .env}
      - DATASOURCE_API_TOKEN=${DATASOURCE_API_TOKEN:?run install.sh to generate .env}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  convex-data:
  datasource-data:
