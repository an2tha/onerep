<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OneRep — Today Native</title>
  <style>
    @font-face{font-family:'Instrument Sans';src:url('../../node_modules/.bun/@fontsource-variable+instrument-sans@5.2.8/node_modules/@fontsource-variable/instrument-sans/files/instrument-sans-latin-wght-normal.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap;}
    :root {
      --bg: #f4f3ef; --panel: #fbfaf7; --raised: #ffffff; --ink: #171a18; --muted: #6f6d68; --quiet: #939089;
      --line: rgba(23,26,24,.13); --line-strong: rgba(23,26,24,.22); --primary: #171a18; --primary-text: #f8faf7;
      --food: #746f68; --water: #6e7472; --workout: #686a64; --supplement: #6f726a; --warning: #7a705f; --success:#687064; --danger:#7b6464;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100svh; background: var(--bg); color:var(--ink); font-family:'Instrument Sans', ui-sans-serif, system-ui, sans-serif; }
    button { font: inherit; color: inherit; border:0; cursor:pointer; }
    button:focus-visible, a:focus-visible { outline:3px solid var(--ink); outline-offset:3px; }
    .app { width:min(430px,100%); min-height:100svh; margin:0 auto; padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom)); display:grid; grid-template-rows:auto auto 1fr auto; gap:16px; }
    .top { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
    .date { margin:0; color:var(--muted); font-size:12px; font-weight:720; letter-spacing:.1em; text-transform:uppercase; }
    h1 { margin:8px 0 0; font-size:32px; line-height:1.02; letter-spacing:-.052em; }
    .sync { min-height:36px; display:inline-flex; align-items:center; gap:7px; border:1px solid rgba(122,112,95,.22); border-radius:999px; padding:0 11px; background:color-mix(in srgb, var(--warning) 8%, transparent); color:#5f5647; font-size:12px; font-weight:720; white-space:nowrap; }
    .sync i { width:7px; height:7px; border-radius:50%; background:var(--warning); }
    .hero { overflow:hidden; border:1px solid var(--line); border-radius:18px; background:var(--panel); box-shadow:0 1px 0 rgba(23,26,24,.05); }
    .calories { width:100%; text-align:left; background:transparent; padding:20px 18px 16px; }
    .label { color:var(--muted); font-size:11px; font-weight:760; letter-spacing:.11em; text-transform:uppercase; }
    .calorie-line { margin-top:14px; display:flex; align-items:flex-end; gap:8px; }
    .number { font-size:72px; line-height:.82; letter-spacing:-.07em; font-weight:760; font-variant-numeric:tabular-nums; }
    .unit { padding-bottom:6px; color:var(--muted); font-size:13px; font-weight:700; }
    .progress { margin-top:16px; height:8px; border-radius:999px; background:rgba(23,26,24,.075); overflow:hidden; }
    .progress i { display:block; width:47%; height:100%; border-radius:inherit; background:var(--ink); }
    .meta { margin-top:8px; display:flex; justify-content:space-between; color:var(--muted); font-size:12px; font-weight:650; }
    .hero-grid { display:grid; grid-template-columns:1fr 1fr; border-top:1px solid var(--line); }
    .hero-grid button { min-height:96px; background:transparent; text-align:left; padding:15px; border-right:1px solid var(--line); }
    .hero-grid button:last-child { border-right:0; }
    .tile-title { display:flex; justify-content:space-between; gap:10px; align-items:center; }
    .tile-title b { font-size:14px; }
    .tile-title span { color:var(--muted); font-size:12px; }
    .smallbar { margin-top:14px; height:6px; border-radius:999px; background:rgba(23,26,24,.075); overflow:hidden; }
    .smallbar i { display:block; height:100%; border-radius:inherit; background:var(--water); width:48%; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .action { min-height:82px; border:1px solid var(--line); border-radius:16px; background:var(--raised); padding:14px; text-align:left; box-shadow:0 1px 0 rgba(23,26,24,.04); }
    .action.primary { grid-column:1 / -1; display:grid; grid-template-columns:1fr auto; align-items:center; gap:14px; background:var(--primary); color:var(--primary-text); }
    .action b { display:block; font-size:15px; letter-spacing:-.01em; }
    .action span { display:block; margin-top:4px; color:var(--muted); font-size:12px; line-height:1.35; }
    .action.primary span { color:rgba(248,250,247,.66); }
    .action strong { font-size:24px; }
    .section-head { display:flex; justify-content:space-between; align-items:end; margin:3px 2px 9px; }
    .section-head h2 { margin:0; font-size:18px; letter-spacing:-.03em; }
    .section-head a { color:var(--muted); font-size:12px; font-weight:720; text-decoration:none; }
    .list { border:1px solid var(--line); border-radius:18px; background:var(--panel); overflow:hidden; }
    .row { display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; padding:13px 14px; border-top:1px solid var(--line); }
    .row:first-child { border-top:0; }
    .mark { width:34px; height:34px; border-radius:10px; display:grid; place-items:center; background:rgba(23,26,24,.06); color:var(--muted); font-size:13px; font-weight:760; }
    .row b { display:block; font-size:13.5px; }
    .row span { display:block; margin-top:2px; color:var(--muted); font-size:12px; }
    .pill { border:1px solid var(--line); border-radius:999px; padding:6px 9px; color:var(--muted); font-size:11px; font-weight:720; }
    .nav { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; border:1px solid var(--line); border-radius:18px; padding:6px; background:rgba(251,250,247,.9); backdrop-filter:blur(16px); }
    .nav button { min-height:44px; border-radius:13px; background:transparent; color:var(--muted); font-size:11px; font-weight:720; }
    .nav button[aria-current="page"] { background:var(--ink); color:var(--primary-text); }
    @media (min-width:720px) { body { display:grid; place-items:center; padding:30px; } .app { min-height:860px; border:1px solid var(--line); border-radius:26px; background:var(--bg); box-shadow:0 30px 80px rgba(23,26,24,.12); } }
  </style>
</head>
<body>
  <main class="app" aria-label="OneRep Today screen">
    <header class="top">
      <div><p class="date">Sat Jun 27</p><h1>Today, Ananth.</h1></div>
      <span class="sync"><i></i>2 queued</span>
    </header>

    <section class="hero" aria-label="Daily summary">
      <button class="calories" aria-label="Open food diary">
        <span class="label">Calories remaining</span>
        <div class="calorie-line"><span class="number">1,050</span><span class="unit">kcal left</span></div>
        <div class="progress" aria-hidden="true"><i></i></div>
        <div class="meta"><span>950 eaten</span><span>2,000 target</span></div>
      </button>
      <div class="hero-grid">
        <button aria-label="Open water log"><span class="label">Water</span><div class="tile-title"><b>1,200 ml</b><span>of 2,500</span></div><div class="smallbar"><i></i></div></button>
        <button aria-label="Open workout"><span class="label">Training</span><div class="tile-title"><b>Upper A</b><span>ready</span></div><div class="smallbar"><i style="width:0;background:var(--workout)"></i></div></button>
      </div>
    </section>

    <section class="actions" aria-label="Primary actions">
      <button class="action primary"><span><b>Log lunch</b><span>Search, scan, or repeat a recent meal</span></span><strong>+</strong></button>
      <button class="action"><b>Add water</b><span>250 ml glass · counts toward goal</span></button>
      <button class="action"><b>Start workout</b><span>Upper A · bench starts first</span></button>
    </section>

    <section aria-label="Today timeline">
      <div class="section-head"><h2>Already logged</h2><a href="#">Edit</a></div>
      <div class="list">
        <article class="row"><span class="mark">09</span><span><b>Greek yogurt + berries</b><span>310 kcal · 27g protein</span></span><span class="pill">synced</span></article>
        <article class="row"><span class="mark">Cr</span><span><b>Creatine coffee</b><span>5g creatine · 45 kcal</span></span><span class="pill">queued</span></article>
        <article class="row"><span class="mark">D</span><span><b>Vitamin D</b><span>Due after lunch</span></span><span class="pill">due</span></article>
      </div>
    </section>

    <nav class="nav" aria-label="Primary navigation"><button aria-current="page">Today</button><button>Food</button><button>Lift</button><button>Progress</button><button>More</button></nav>
  </main>
</body>
</html>
