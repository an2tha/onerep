<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OneRep — Active Workout</title>
  <style>
    @font-face{font-family:'Instrument Sans';src:url('../../node_modules/.bun/@fontsource-variable+instrument-sans@5.2.8/node_modules/@fontsource-variable/instrument-sans/files/instrument-sans-latin-wght-normal.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap;}
    :root { --bg:#0d0d0c; --panel:#161615; --raised:#1d1d1b; --elevated:#22221f; --ink:#f5f4ef; --muted:#96958e; --quiet:#6e6d67; --line:rgba(255,255,255,.11); --line-strong:rgba(255,255,255,.18); --primary:#a8aaa4; --primary-text:#121312; --success:#9fa99a; --warning:#aaa18f; --danger:#aa9696; color-scheme:dark; }
    * { box-sizing:border-box; } body { margin:0; min-height:100svh; background:var(--bg); color:var(--ink); font-family:'Instrument Sans', ui-sans-serif, system-ui, sans-serif; } button { font:inherit; border:0; color:inherit; cursor:pointer; } button:focus-visible { outline:3px solid var(--primary); outline-offset:3px; }
    .app { width:min(430px,100%); min-height:100svh; margin:0 auto; padding:max(18px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom)); display:grid; grid-template-rows:auto auto auto 1fr auto; gap:14px; background:var(--bg); }
    .top { display:flex; justify-content:space-between; align-items:center; } .back { min-height:44px; border:1px solid var(--line); border-radius:999px; background:var(--panel); padding:0 14px; color:var(--muted); font-size:13px; font-weight:720; } .live { min-height:32px; display:inline-flex; align-items:center; gap:7px; border:1px solid rgba(159,169,154,.22); border-radius:999px; padding:0 10px; color:var(--success); background:rgba(159,169,154,.08); font-size:12px; font-weight:760; } .live i { width:7px; height:7px; border-radius:50%; background:var(--success); }
    .headline { display:grid; grid-template-columns:1fr auto; gap:12px; align-items:end; } .headline p { margin:0 0 8px; color:var(--muted); font-size:12px; font-weight:760; letter-spacing:.1em; text-transform:uppercase; } h1 { margin:0; font-size:40px; line-height:.96; letter-spacing:-.06em; } .setbox { min-width:78px; border:1px solid var(--line); border-radius:16px; padding:10px; background:var(--panel); text-align:center; } .setbox span { display:block; color:var(--muted); font-size:10px; font-weight:760; letter-spacing:.08em; text-transform:uppercase; } .setbox b { display:block; margin-top:3px; font-size:25px; }
    .timer { border:1px solid var(--line); border-radius:22px; background:var(--panel); padding:16px; display:grid; grid-template-columns:1fr auto; gap:16px; align-items:center; box-shadow:inset 0 1px rgba(255,255,255,.04); } .timer .label { color:var(--muted); font-size:11px; font-weight:760; letter-spacing:.11em; text-transform:uppercase; } .time { margin-top:5px; font-size:58px; line-height:.86; letter-spacing:-.06em; font-weight:760; font-variant-numeric:tabular-nums; } .skip { min-height:44px; border-radius:14px; padding:0 13px; background:var(--elevated); color:var(--ink); font-size:13px; font-weight:760; }
    .sets { border:1px solid var(--line); border-radius:22px; background:var(--panel); overflow:hidden; } .set-row { display:grid; grid-template-columns:44px 1fr 1fr 1fr 48px; gap:6px; align-items:center; min-height:62px; padding:8px; border-top:1px solid var(--line); } .set-row:first-child { border-top:0; } .set-row.header { min-height:36px; color:var(--muted); font-size:10px; font-weight:760; letter-spacing:.1em; text-transform:uppercase; } .set-row.current { background:rgba(168,170,164,.08); } .cell { min-height:44px; border:1px solid var(--line); border-radius:12px; background:rgba(255,255,255,.025); display:grid; place-items:center; font-size:15px; font-weight:760; font-variant-numeric:tabular-nums; } .index { color:var(--muted); } .done { background:rgba(159,169,154,.16); color:var(--success); }
    .next { display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; border:1px solid var(--line); border-radius:18px; background:var(--raised); padding:13px; } .next span { color:var(--muted); font-size:11px; font-weight:760; letter-spacing:.1em; text-transform:uppercase; } .next b { display:block; margin-top:5px; font-size:16px; } .next p { margin:3px 0 0; color:var(--muted); font-size:12px; } .load { min-height:40px; border-radius:13px; padding:0 12px; background:var(--elevated); color:var(--ink); font-size:13px; font-weight:760; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; } .actions button { min-height:54px; border-radius:16px; background:var(--elevated); font-weight:780; } .actions .primary { grid-column:1 / -1; min-height:60px; background:var(--primary); color:var(--primary-text); font-size:16px; }
    @media (min-width:720px) { body { display:grid; place-items:center; padding:30px; background:#090908; } .app { min-height:860px; border:1px solid var(--line); border-radius:26px; box-shadow:0 30px 80px rgba(0,0,0,.36); } }
  </style>
</head>
<body>
  <main class="app" aria-label="OneRep active workout screen">
    <header class="top"><button class="back">End later</button><span class="live"><i></i>Live workout</span></header>
    <section class="headline"><div><p>Upper A · exercise 2 of 5</p><h1>Bench press</h1></div><aside class="setbox"><span>Set</span><b>3</b></aside></section>
    <section class="timer" aria-label="Rest timer"><div><span class="label">Rest remaining</span><div class="time">00:42</div></div><button class="skip">Skip</button></section>
    <section class="sets" aria-label="Set table"><div class="set-row header"><span>#</span><span>kg</span><span>reps</span><span>RPE</span><span></span></div><div class="set-row"><span class="cell index">1</span><span class="cell">60</span><span class="cell">8</span><span class="cell">6</span><button class="cell done" aria-label="Set 1 complete">✓</button></div><div class="set-row"><span class="cell index">2</span><span class="cell">75</span><span class="cell">5</span><span class="cell">8</span><button class="cell done" aria-label="Set 2 complete">✓</button></div><div class="set-row current"><span class="cell index">3</span><span class="cell">80</span><span class="cell">5</span><span class="cell">—</span><button class="cell" aria-label="Complete set 3">○</button></div><div class="set-row"><span class="cell index">4</span><span class="cell">80</span><span class="cell">5</span><span class="cell">—</span><button class="cell" aria-label="Set 4 not started">—</button></div></section>
    <section class="next" aria-label="Next exercise"><span><span>Next movement</span><b>Chest-supported row</b><p>3 sets · 90 sec rest · last time 42.5 kg</p></span><button class="load">Load</button></section>
    <nav class="actions" aria-label="Workout actions"><button>Adjust target</button><button>Add note</button><button class="primary">Complete set 3</button></nav>
  </main>
</body>
</html>
