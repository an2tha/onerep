<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Option 01 — Calorie Dial</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% -12%,rgba(255,255,255,.8),transparent 28rem),#f7f4ed;color:#171513;font-family:Instrument Sans,Avenir Next,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}button{font:inherit}.tag{position:fixed;right:10px;top:10px;border:1px solid #e1dbcf;border-radius:999px;background:rgba(255,253,248,.86);padding:7px 10px;color:#756f66;font-size:11px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}.app{width:min(100% - 24px,430px);margin:auto;min-height:100svh;padding:max(24px,env(safe-area-inset-top)) 0 24px}.date{margin:0;color:#756f66;font-size:12px;font-weight:850;letter-spacing:.14em;text-transform:uppercase}.hello{margin:12px 0 20px;font-size:clamp(32px,9.5vw,42px);line-height:.96;letter-spacing:-.055em}.panel{background:linear-gradient(#fffdf8,#fbf8f1);border:1px solid #e1dbcf;border-radius:28px;box-shadow:0 18px 60px rgba(34,28,20,.08)}.ey{color:#756f66;font-size:11px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.mut{color:#756f66}.btn{min-height:48px;border:1px solid #e1dbcf;border-radius:16px;background:#fffdf8;padding:0 14px;font-weight:850}.primary{background:#171513;color:#f7f4ed;border-color:#171513}.label2{font-size:12px;color:#756f66;font-weight:800}.num{font-variant-numeric:tabular-nums;font-weight:900;letter-spacing:-.07em}@media(min-width:880px){.app{width:min(100% - 52px,920px);display:grid;grid-template-columns:310px 1fr;gap:28px;padding-top:60px}.head{position:sticky;top:60px;align-self:start}.hello{font-size:58px}.main{grid-column:2}}@media(prefers-reduced-motion:no-preference){.panel{animation:in .35s ease both}@keyframes in{from{opacity:0;transform:translateY(10px)}}}.dial{display:grid;place-items:center;min-height:370px;padding:22px}.ring{width:260px;height:260px;border-radius:50%;background:conic-gradient(#171513 0 70%,#eee8dc 70%);display:grid;place-items:center}.core{width:204px;height:204px;border-radius:50%;background:#fffdf8;display:grid;place-items:center;text-align:center;border:1px solid #e1dbcf}.core b{font-size:78px;line-height:.8}.below{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.tile{padding:16px;border-radius:22px}.actions{display:grid;grid-template-columns:1.2fr .8fr;gap:10px;margin-top:12px}</style></head><body><div class="tag">Option 01 — Calorie Dial</div><main class="app"><header class="head"><p class="date">Sat, Jun 27</p><h1 class="hello">Good afternoon, Ananth.</h1></header><section class="main"><article class="panel dial"><div><div class="ring"><div class="core"><span class="ey">remaining</span><b class="num">663</b><span class="mut">kcal left</span></div></div></div></article><div class="below"><div class="panel tile"><span class="ey">Water</span><h2>1.25 L</h2><p class="mut">of 2.5 L</p></div><div class="panel tile"><span class="ey">Training</span><h2>Ready</h2><p class="mut">Upper Strength</p></div></div><div class="actions"><button class="btn primary">Log dinner</button><button class="btn">+250 ml</button></div></section></main></body></html>
