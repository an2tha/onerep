<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Option 03 — Meal Focus</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% -12%,rgba(255,255,255,.8),transparent 28rem),#f7f4ed;color:#171513;font-family:Instrument Sans,Avenir Next,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}button{font:inherit}.tag{position:fixed;right:10px;top:10px;border:1px solid #e1dbcf;border-radius:999px;background:rgba(255,253,248,.86);padding:7px 10px;color:#756f66;font-size:11px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}.app{width:min(100% - 24px,430px);margin:auto;min-height:100svh;padding:max(24px,env(safe-area-inset-top)) 0 24px}.date{margin:0;color:#756f66;font-size:12px;font-weight:850;letter-spacing:.14em;text-transform:uppercase}.hello{margin:12px 0 20px;font-size:clamp(32px,9.5vw,42px);line-height:.96;letter-spacing:-.055em}.panel{background:linear-gradient(#fffdf8,#fbf8f1);border:1px solid #e1dbcf;border-radius:28px;box-shadow:0 18px 60px rgba(34,28,20,.08)}.ey{color:#756f66;font-size:11px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.mut{color:#756f66}.btn{min-height:48px;border:1px solid #e1dbcf;border-radius:16px;background:#fffdf8;padding:0 14px;font-weight:850}.primary{background:#171513;color:#f7f4ed;border-color:#171513}.label2{font-size:12px;color:#756f66;font-weight:800}.num{font-variant-numeric:tabular-nums;font-weight:900;letter-spacing:-.07em}@media(min-width:880px){.app{width:min(100% - 52px,920px);display:grid;grid-template-columns:310px 1fr;gap:28px;padding-top:60px}.head{position:sticky;top:60px;align-self:start}.hello{font-size:58px}.main{grid-column:2}}@media(prefers-reduced-motion:no-preference){.panel{animation:in .35s ease both}@keyframes in{from{opacity:0;transform:translateY(10px)}}}.sheet{margin-top:86px;padding:20px;border-radius:34px 34px 28px 28px}.handle{width:42px;height:5px;border-radius:999px;background:#ddd5c8;margin:0 auto 18px}.title{font-size:44px;line-height:.92;letter-spacing:-.06em;margin:8px 0 14px}.choice{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 0;border-top:1px solid #e1dbcf}.choice:first-of-type{border-top:0}.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.m{background:#f2eee5;border-radius:16px;padding:12px}.m b{display:block;font-size:20px}</style></head><body><div class="tag">Option 03 — Meal Focus</div><main class="app"><header class="head"><p class="date">Sat, Jun 27</p><h1 class="hello">Good afternoon, Ananth.</h1></header><section class="main"><article class="panel sheet"><div class="handle"></div><span class="ey">Dinner workspace</span><h2 class="title">You have room for a real dinner.</h2><p class="mut">663 kcal left. Lunch is logged; one sodium estimate can wait.</p><div class="choice"><span><b>Search or scan food</b><br><small class="mut">Best for a new meal</small></span><button class="btn primary">Open</button></div><div class="choice"><span><b>Repeat chicken bowl</b><br><small class="mut">680 kcal last logged</small></span><button class="btn">Repeat</button></div><div class="macros"><div class="m"><span class="ey">Protein</span><b>86g</b></div><div class="m"><span class="ey">Carbs</span><b>154g</b></div><div class="m"><span class="ey">Fat</span><b>49g</b></div></div></article></section></main></body></html>
