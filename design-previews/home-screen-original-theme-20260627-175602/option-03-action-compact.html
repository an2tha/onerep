<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Option 03 — Action Compact</title><style>
:root{--bg:#f7f4ed;--card:#fffdf8;--card2:#fbf8f1;--ink:#171513;--muted:#756f66;--faint:#9d968b;--line:#e1dbcf;--soft:#efebe3;--pressed:#e9e3d8;--shadow:0 18px 60px rgba(34,28,20,.08);--radius:26px;--focus:#171513}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% -20%,rgba(255,255,255,.8),transparent 30rem),var(--bg);color:var(--ink);font-family:Instrument Sans,Avenir Next,-apple-system,BlinkMacSystemFont,"Segoe UI",ui-sans-serif,system-ui,sans-serif}button{font:inherit;color:inherit}button:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.label{position:fixed;top:10px;right:10px;z-index:5;border:1px solid var(--line);border-radius:999px;background:rgba(255,253,248,.82);backdrop-filter:blur(8px);padding:7px 10px;color:var(--muted);font-size:11px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}.app{width:min(100% - 24px,430px);margin:0 auto;min-height:100svh;padding:max(24px,env(safe-area-inset-top)) 0 26px}.date{margin:0;color:var(--muted);font-size:12px;font-weight:850;letter-spacing:.14em;text-transform:uppercase}.hello{margin:12px 0 20px;font-size:clamp(32px,9.6vw,42px);line-height:.96;letter-spacing:-.055em;font-weight:850}.panel{border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(180deg,var(--card),var(--card2));box-shadow:var(--shadow);overflow:hidden}.eyebrow{color:var(--muted);font-size:11px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.big{font-size:78px;line-height:.82;letter-spacing:-.08em;font-weight:900;font-variant-numeric:tabular-nums}.sub{color:var(--muted);font-size:12px;font-weight:750}.bar{height:8px;border-radius:999px;background:rgba(23,21,19,.075);overflow:hidden}.bar i{display:block;height:100%;width:70%;border-radius:inherit;background:var(--ink)}.btn{min-height:48px;border:1px solid var(--line);border-radius:16px;background:var(--card);padding:0 14px;text-align:left;font-weight:850}.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;min-height:56px;padding:12px 16px;border-top:1px solid var(--line)}.row:first-child{border-top:0}.row b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.row small{display:block;margin-top:3px;color:var(--muted);font-size:12px}.time{color:var(--muted);font-size:11px;font-weight:850;font-variant-numeric:tabular-nums}.pill{border:1px solid var(--line);border-radius:999px;padding:6px 9px;color:var(--muted);font-size:11px;font-weight:850;white-space:nowrap}.section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 9px}.section-title h2{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.quiet{border:0;background:transparent;color:var(--ink);font-size:13px;font-weight:850;padding:8px}.warn{margin-top:12px;border:1px solid #e2cfae;border-radius:18px;background:#fff8e8;padding:12px 14px;color:#76521f;font-size:13px;line-height:1.35}@media(min-width:880px){.app{width:min(100% - 52px,920px);display:grid;grid-template-columns:320px 1fr;gap:24px;padding-top:60px}.head{position:sticky;top:60px;align-self:start}.hello{font-size:58px}.wide{grid-column:2}}@media(prefers-reduced-motion:no-preference){.panel,.warn{animation:up .36s ease both}@keyframes up{from{opacity:0;transform:translateY(10px)}}}
</style></head><body><div class="label">Option 03 — Action Compact</div><main class="app"><header class="head"><p class="date">Sat, Jun 27</p><h1 class="hello">Good afternoon, Ananth.</h1></header>
<section class="wide"><article class="panel"><div style="padding:18px"><span class="eyebrow">Next action</span><button class="btn primary" style="width:100%;margin-top:12px;min-height:62px;font-size:17px">Log dinner <span style="opacity:.65;font-size:12px;display:block;margin-top:4px">Search, scan, or repeat meal</span></button><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><button class="btn">Add water<span class="sub" style="display:block">+250 ml</span></button><button class="btn">Start workout<span class="sub" style="display:block">Upper Strength</span></button></div></div><div style="border-top:1px solid var(--line);padding:18px"><span class="eyebrow">Remaining</span><div style="display:flex;align-items:end;gap:8px;margin-top:10px"><strong class="big">663</strong><span class="sub" style="padding-bottom:8px">kcal</span></div><div class="bar"><i></i></div></div></article><div class="section-title"><h2>Today</h2><button class="quiet">Edit</button></div><section class="panel"><div class="row"><span><b>Water</b><small>1,250 / 2,500 ml</small></span><span class="pill">half</span></div><div class="row"><span><b>Supplements</b><small>Creatine and D3 logged</small></span><span class="pill">2/4</span></div><div class="row"><span><b>Recent food</b><small>Chicken rice bowl, latte, yogurt</small></span><span class="pill">940 kcal</span></div></section></section></main></body></html>
