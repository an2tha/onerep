<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Option 01 — Rack Timer</title>
  <style>
    :root{--floor:#0d0f0d;--mat:#171915;--steel:#c9c2b3;--chalk:#f4eddf;--ash:#8d897d;--line:rgba(244,237,223,.14);--plate:#d69b3d;--green:#8da56f;--red:#c06652;color-scheme:dark}
    *{box-sizing:border-box} body{margin:0;min-height:100svh;background:radial-gradient(circle at 12% 8%,rgba(214,155,61,.22),transparent 20rem),repeating-linear-gradient(135deg,rgba(244,237,223,.035) 0 1px,transparent 1px 18px),var(--floor);color:var(--chalk);font-family:"DIN Alternate","Avenir Next Condensed","Arial Narrow",ui-sans-serif,system-ui,sans-serif} button{font:inherit;color:inherit;border:0;cursor:pointer} button:focus-visible{outline:3px solid var(--plate);outline-offset:4px}.rack{width:min(430px,100%);min-height:100svh;margin:0 auto;padding:16px 14px 18px;display:grid;grid-template-rows:auto auto 1fr auto;gap:12px;background:linear-gradient(180deg,#151713,#0b0d0b);box-shadow:0 0 0 1px rgba(244,237,223,.08),0 40px 90px rgba(0,0,0,.5)}.top{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}.tag{width:max-content;border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:var(--plate);background:rgba(214,155,61,.08);font-size:10px;font-weight:950;letter-spacing:.16em;text-transform:uppercase}.sync{color:var(--ash);font-size:11px;font-weight:850;text-align:right}.headline{display:grid;grid-template-columns:1fr 86px;gap:12px;align-items:stretch}.headline h1{margin:0;font-size:64px;line-height:.78;letter-spacing:-.075em;text-transform:uppercase}.round{border:1px solid rgba(214,155,61,.38);border-radius:22px;background:rgba(214,155,61,.09);display:grid;place-items:center;text-align:center;color:var(--plate);font-weight:950;text-transform:uppercase;letter-spacing:.08em}.round b{display:block;color:var(--chalk);font-size:30px;letter-spacing:-.04em}.timer{position:relative;overflow:hidden;border:1px solid rgba(244,237,223,.18);border-radius:34px;background:linear-gradient(180deg,#24231d,#151713);padding:18px;box-shadow:inset 0 1px rgba(255,255,255,.08),0 20px 42px rgba(0,0,0,.28)}.timer:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(244,237,223,.055) 1px,transparent 1px) 0 0/21px 21px;mask-image:linear-gradient(180deg,#000,transparent 72%)}.timer small{position:relative;color:var(--ash);font-size:11px;font-weight:950;letter-spacing:.17em;text-transform:uppercase}.time{position:relative;margin-top:4px;font-size:104px;line-height:.82;letter-spacing:-.08em;font-variant-numeric:tabular-nums}.next{position:relative;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-top:10px}.next b{font-size:20px;text-transform:uppercase;letter-spacing:-.03em}.next span{display:block;margin-top:3px;color:var(--ash);font-family:ui-sans-serif,system-ui;font-size:12px}.plates{display:flex;gap:5px;align-items:center}.plates i{width:14px;height:58px;border-radius:999px;background:var(--plate);box-shadow:inset -3px 0 rgba(0,0,0,.25)}.plates i:nth-child(2),.plates i:nth-child(4){height:48px;background:#9c7140}.work{display:grid;grid-template-columns:72px 1fr;gap:10px;min-height:0}.spine{border:1px solid var(--line);border-radius:26px;background:#10120f;display:grid;place-items:center;padding:10px 0}.spine span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:18px;font-weight:950;letter-spacing:.12em;text-transform:uppercase;color:var(--ash)}.sets{border:1px solid var(--line);border-radius:26px;background:rgba(244,237,223,.045);padding:9px;display:grid;gap:7px;align-content:start}.set{display:grid;grid-template-columns:34px 1fr 1fr 48px;gap:7px;align-items:center;border-radius:18px;padding:8px;background:rgba(244,237,223,.045)}.set.current{background:rgba(214,155,61,.14);box-shadow:inset 0 0 0 1px rgba(214,155,61,.35)}.set b{display:grid;place-items:center;width:34px;height:34px;border-radius:12px;background:rgba(244,237,223,.1);color:var(--plate)}.cell{min-height:40px;border:1px solid rgba(244,237,223,.12);border-radius:13px;display:grid;place-items:center;font-size:19px;font-weight:950;background:rgba(0,0,0,.18);font-variant-numeric:tabular-nums}.done{background:var(--green);color:#0b1008}.miss{background:rgba(192,102,82,.16);color:#e4a08d}.dock{display:grid;grid-template-columns:1fr 1fr;gap:9px}.dock button{min-height:58px;border-radius:20px;background:rgba(244,237,223,.08);font-size:13px;font-weight:950;text-transform:uppercase;letter-spacing:.08em}.dock .primary{grid-column:span 2;background:var(--plate);color:#17100a;font-size:16px}.dock button:active{transform:translateY(1px)}@media (min-width:700px){body{display:grid;place-items:center;padding:30px}.rack{min-height:860px;border-radius:44px}}@media (prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="rack" aria-label="OneRep active workout rack timer">
    <div class="top"><span class="tag">Option 01 · Rack Timer</span><span class="sync">offline-safe · 2 queued</span></div>
    <section class="headline" aria-label="Current exercise"><h1>Bench<br>press</h1><div class="round"><span>set</span><b>3/5</b></div></section>
    <section class="timer" aria-label="Rest timer and next set">
      <small>rest timer</small><div class="time">00:42</div>
      <div class="next"><div><b>80 kg × 5</b><span>target RPE 8 · last set felt fast</span></div><div class="plates" aria-label="plates loaded"><i></i><i></i><i></i><i></i></div></div>
    </section>
    <section class="work" aria-label="Set log">
      <div class="spine"><span>squat done · bench live · row next</span></div>
      <div class="sets">
        <div class="set"><b>1</b><div class="cell">60</div><div class="cell">8</div><button class="cell done" aria-label="set 1 complete">✓</button></div>
        <div class="set"><b>2</b><div class="cell">75</div><div class="cell">5</div><button class="cell done" aria-label="set 2 complete">✓</button></div>
        <div class="set current"><b>3</b><div class="cell">80</div><div class="cell">5</div><button class="cell" aria-label="log set 3">○</button></div>
        <div class="set"><b>4</b><div class="cell">80</div><div class="cell">5</div><button class="cell miss" aria-label="not started">–</button></div>
      </div>
    </section>
    <nav class="dock" aria-label="Workout actions"><button>Drop 2.5kg</button><button>Skip timer</button><button class="primary">Log set 3</button></nav>
  </main>
</body>
</html>
