        - generic [ref=e698]:
          - generic [ref=e699] [cursor=pointer]: Can I change plans after I make a choice?
          - generic [ref=e705]:
            - paragraph [ref=e707]: Yes! During your free trial, you can try as many teams as you would like. Our goal is for you to find the right match, we are confident that we have a team for everyone.
            - paragraph [ref=e709]: For subscribed members, we offer the PRO Annual plan to get access to all teams whenever you want. For the PRO Monthly plan, you can change teams twice per month.
        - generic [ref=e710]:
          - generic [ref=e711] [cursor=pointer]: Is Ladder for people who work out at home or at the gym?
          - paragraph [ref=e719]: Ladder members work out at home, at the gym, outside, or across all three. With Ladder your workout programming is in your pocket and ready when you are.
        - generic [ref=e720]:
          - generic [ref=e721] [cursor=pointer]: How is Ladder different from other fitness apps?
          - generic [ref=e727]:
            - paragraph [ref=e729]: Ladder is built for strength training and specifically for busy people who are already motivated to workout.
            - paragraph [ref=e731]: This isn't just a library of random workout content. Ladder gives you a complete workout plan to help you maximize your workouts and achieve real results.
            - paragraph [ref=e733]: With Ladder you'll know exactly what workout to do, with a daily workout plan that's programmed by an expert coach and new each week.
            - paragraph [ref=e735]: "With Ladder, you get:"
            - paragraph [ref=e737]: ✓ Results in less time
            - paragraph [ref=e739]: ✓ New workouts every week
            - paragraph [ref=e741]: ✓ A training plan that's always with you
            - paragraph [ref=e743]: ✓ Real coaching
