        - generic [ref=e685]:
          - generic [ref=e686] [cursor=pointer]: How do I find the right plan/program?
          - generic [ref=e692]:
            - paragraph [ref=e694]: Ladder features some of the best strength coaches in the world, each offering unique coaching and training styles.
            - paragraph [ref=e696]:
              - text: To find the right team/fitness plan, we recommend taking the
              - link "team quiz" [ref=e697] [cursor=pointer]:
