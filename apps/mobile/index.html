<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Track workouts, food, water, supplements, and body progress from one mobile-first training log."
    />
    <meta name="application-name" content="OneRep" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0c" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <style>
      /*
        Painted before any bundle CSS loads. Matters most for the SSO
        handoff in native-oauth.ts, which lands here via a hard
        window.location.replace() (a real WebView navigation, not a
        router transition) — without this, that reload flashes stark
        white for as long as the JS bundle takes to boot.
      */
      html,
      body {
        background-color: #f4f3ef;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #0d0d0c;
        }
      }
    </style>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OneRep" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="msapplication-TileColor" content="#f4f4f5" />
    <meta name="format-detection" content="telephone=no" />
    <!--
      The Umami tags used to be hardcoded here, which meant every self-hosted
      install quietly reported to a stranger's analytics instance. They are now
      injected at build time by onerep-umami in vite.config.ts, only when
      VITE_UMAMI_SCRIPT_URL and VITE_UMAMI_WEBSITE_ID are both set. Unconfigured
      builds ship no tracker at all — that is the point, do not put them back.
    -->
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>OneRep</title>
  </head>
  <body style="overflow: hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
