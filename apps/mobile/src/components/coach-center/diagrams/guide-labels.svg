<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" role="img" aria-labelledby="guide-labels-title guide-labels-desc" style="font-family:var(--font-sans, sans-serif)"><title id="guide-labels-title">Scale the label to your portion</title><desc id="guide-labels-desc">Illustrative label arithmetic. Actual labels contain rounding.</desc><text x="135.0" y="80.0" font-size="17" fill="var(--foreground, #171a18)" text-anchor="middle" font-weight="400">240 kcal / 100 g</text><text x="240.0" y="85" font-size="20" fill="var(--muted-foreground, #625f59)" text-anchor="middle" font-weight="400">×</text><text x="345.0" y="80.0" font-size="17" fill="var(--foreground, #171a18)" text-anchor="middle" font-weight="400">75 g portion</text><line x1="100" y1="120" x2="380" y2="120" stroke="var(--divider, #d8d7d2)" stroke-width="1.5" /><text x="240" y="174" font-size="32" fill="var(--accent-workout, #5b5bd6)" text-anchor="middle" font-weight="600">180 kcal</text><text x="240" y="216" font-size="13" fill="var(--muted-foreground, #625f59)" text-anchor="middle" font-weight="400">Illustrative calculation</text></svg>