<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" role="img" aria-labelledby="guide-meals-title guide-meals-desc" style="font-family:var(--font-sans, sans-serif)"><title id="guide-meals-title">A flexible meal-building example</title><desc id="guide-meals-desc">Components, not fixed proportions. Food groups overlap nutritionally.</desc><line x1="118.0" y1="120" x2="130.0" y2="120" stroke="var(--divider, #d8d7d2)" stroke-width="1.5" /><rect x="20.0" y="82" width="98.0" height="82" rx="7" fill="var(--surface-panel, #fbfaf7)" stroke="var(--divider, #d8d7d2)"/><text x="69.0" y="126.0" font-size="15" fill="var(--accent-workout, #5b5bd6)" text-anchor="middle" font-weight="400">Vegetables</text><line x1="228.0" y1="120" x2="240.0" y2="120" stroke="var(--divider, #d8d7d2)" stroke-width="1.5" /><rect x="130.0" y="82" width="98.0" height="82" rx="7" fill="var(--surface-panel, #fbfaf7)" stroke="var(--divider, #d8d7d2)"/><text x="179.0" y="115.5" font-size="15" fill="var(--foreground, #171a18)" text-anchor="middle" font-weight="400">Protein</text><text x="179.0" y="136.5" font-size="15" fill="var(--foreground, #171a18)" text-anchor="middle" font-weight="400">food</text><line x1="338.0" y1="120" x2="350.0" y2="120" stroke="var(--divider, #d8d7d2)" stroke-width="1.5" /><rect x="240.0" y="82" width="98.0" height="82" rx="7" fill="var(--surface-panel, #fbfaf7)" stroke="var(--divider, #d8d7d2)"/><text x="289.0" y="115.5" font-size="15" fill="var(--foreground, #171a18)" text-anchor="middle" font-weight="400">Grain or</text><text x="289.0" y="136.5" font-size="15" fill="var(--foreground, #171a18)" text-anchor="middle" font-weight="400">starch</text><rect x="350.0" y="82" width="98.0" height="82" rx="7" fill="var(--surface-panel, #fbfaf7)" stroke="var(--divider, #d8d7d2)"/><text x="399.0" y="115.5" font-size="15" fill="var(--foreground, #171a18)" text-anchor="middle" font-weight="400">Flavor and</text><text x="399.0" y="136.5" font-size="15" fill="var(--foreground, #171a18)" text-anchor="middle" font-weight="400">fat</text><text x="240" y="208" font-size="13" fill="var(--muted-foreground, #625f59)" text-anchor="middle" font-weight="400">Example workflow</text></svg>