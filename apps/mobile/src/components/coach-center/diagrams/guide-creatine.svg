<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" role="img" aria-labelledby="guide-creatine-title guide-creatine-desc" style="font-family:var(--font-sans, sans-serif)"><title id="guide-creatine-title">A simplified energy-transfer relationship</title><desc id="guide-creatine-desc">Conceptual relationship only. It does not depict reaction rates or individual performance gains.</desc><line x1="240" y1="60" x2="365" y2="174" stroke="var(--divider, #d8d7d2)" stroke-width="1.5" /><line x1="365" y1="174" x2="115" y2="174" stroke="var(--divider, #d8d7d2)" stroke-width="1.5" /><line x1="115" y1="174" x2="240" y2="60" stroke="var(--divider, #d8d7d2)" stroke-width="1.5" /><rect x="150" y="32" width="180" height="56" rx="28" fill="var(--surface-panel, #fbfaf7)" stroke="var(--divider, #d8d7d2)"/><text x="240" y="66.0" font-size="16" fill="var(--accent-workout, #5b5bd6)" text-anchor="middle" font-weight="400">Phosphocreatine</text><rect x="275" y="146" width="180" height="56" rx="28" fill="var(--surface-panel, #fbfaf7)" stroke="var(--divider, #d8d7d2)"/><text x="365" y="180.0" font-size="16" fill="var(--accent-workout, #5b5bd6)" text-anchor="middle" font-weight="400">ATP replenishment</text><rect x="25" y="146" width="180" height="56" rx="28" fill="var(--surface-panel, #fbfaf7)" stroke="var(--divider, #d8d7d2)"/><text x="115" y="180.0" font-size="16" fill="var(--accent-workout, #5b5bd6)" text-anchor="middle" font-weight="400">Brief hard effort</text></svg>