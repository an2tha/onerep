<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" role="img" aria-labelledby="guide-range-title guide-range-desc" style="font-family:var(--font-sans, sans-serif)"><title id="guide-range-title">Specify the trained part of the movement</title><desc id="guide-range-desc">Schematic movement range. It does not prescribe a joint angle, depth, or pain-free limit.</desc><line x1="55" y1="125" x2="425" y2="125" stroke="var(--accent-workout, #5b5bd6)" stroke-width="1.5" /><circle cx="55" cy="125" r="7" fill="var(--accent-workout, #5b5bd6)"/><circle cx="425" cy="125" r="7" fill="var(--accent-workout, #5b5bd6)"/><text x="240" y="85" font-size="18" fill="var(--foreground, #171a18)" text-anchor="middle" font-weight="400">Defined movement excursion</text><text x="55" y="172" font-size="15" fill="var(--muted-foreground, #625f59)" text-anchor="start" font-weight="400">Start position</text><text x="425" y="172" font-size="15" fill="var(--muted-foreground, #625f59)" text-anchor="end" font-weight="400">End position</text><line x1="55" y1="102" x2="55" y2="146" stroke="var(--divider, #d8d7d2)" stroke-width="1.5" /><line x1="425" y1="102" x2="425" y2="146" stroke="var(--divider, #d8d7d2)" stroke-width="1.5" /></svg>