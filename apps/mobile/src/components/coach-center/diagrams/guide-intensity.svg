<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" role="img" aria-labelledby="guide-intensity-title guide-intensity-desc" style="font-family:var(--font-sans, sans-serif)"><title id="guide-intensity-title">Talk-test cues</title><desc id="guide-intensity-desc">A rough relative-intensity guide. Symptoms and individual circumstances matter.</desc><rect x="24.0" y="62" width="138.0" height="104" rx="7" fill="var(--surface-panel, #fbfaf7)" stroke="var(--divider, #d8d7d2)"/><text x="93.0" y="94.0" font-size="16" fill="var(--foreground, #171a18)" text-anchor="middle" font-weight="400">Easy</text><text x="93.0" y="129.5" font-size="15" fill="var(--accent-workout, #5b5bd6)" text-anchor="middle" font-weight="400">Comfortable</text><text x="93.0" y="150.5" font-size="15" fill="var(--accent-workout, #5b5bd6)" text-anchor="middle" font-weight="400">talk</text><rect x="168.0" y="62" width="138.0" height="104" rx="7" fill="var(--surface-panel, #fbfaf7)" stroke="var(--divider, #d8d7d2)"/><text x="237.0" y="94.0" font-size="16" fill="var(--foreground, #171a18)" text-anchor="middle" font-weight="400">Moderate</text><text x="237.0" y="129.5" font-size="15" fill="var(--accent-workout, #5b5bd6)" text-anchor="middle" font-weight="400">Talk, not</text><text x="237.0" y="150.5" font-size="15" fill="var(--accent-workout, #5b5bd6)" text-anchor="middle" font-weight="400">sing</text><rect x="312.0" y="62" width="138.0" height="104" rx="7" fill="var(--surface-panel, #fbfaf7)" stroke="var(--divider, #d8d7d2)"/><text x="381.0" y="94.0" font-size="16" fill="var(--foreground, #171a18)" text-anchor="middle" font-weight="400">Vigorous</text><text x="381.0" y="140.0" font-size="15" fill="var(--accent-workout, #5b5bd6)" text-anchor="middle" font-weight="400">Few words</text></svg>