<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" role="img" aria-labelledby="guide-deload-title guide-deload-desc" style="font-family:var(--font-sans, sans-serif)"><title id="guide-deload-title">Example reduction in set count</title><desc id="guide-deload-desc">Illustrative planning arithmetic. No fixed deload percentage is prescribed.</desc><text x="32" y="26" font-size="14" fill="var(--muted-foreground, #625f59)" text-anchor="start" font-weight="400">working sets</text><line x1="45" y1="190.0" x2="460" y2="190.0" stroke="var(--divider, #d8d7d2)" stroke-width="1.5" /><text x="33" y="195.0" font-size="13" fill="var(--muted-foreground, #625f59)" text-anchor="end" font-weight="400">0</text><line x1="45" y1="125.0" x2="460" y2="125.0" stroke="var(--divider, #d8d7d2)" stroke-width="1.5" /><text x="33" y="130.0" font-size="13" fill="var(--muted-foreground, #625f59)" text-anchor="end" font-weight="400">18</text><line x1="45" y1="60.0" x2="460" y2="60.0" stroke="var(--divider, #d8d7d2)" stroke-width="1.5" /><text x="33" y="65.0" font-size="13" fill="var(--muted-foreground, #625f59)" text-anchor="end" font-weight="400">36</text><rect x="46.0" y="60.0" width="48" height="130.0" rx="4" fill="var(--accent-workout, #5b5bd6)" stroke="none"/><text x="70.0" y="50.0" font-size="16" fill="var(--foreground, #171a18)" text-anchor="middle" font-weight="400">36</text><text x="70.0" y="218.0" font-size="14" fill="var(--muted-foreground, #625f59)" text-anchor="middle" font-weight="400">Usual week</text><rect x="406.0" y="125.0" width="48" height="65.0" rx="4" fill="var(--accent-workout, #5b5bd6)" stroke="none"/><text x="430.0" y="115.0" font-size="16" fill="var(--foreground, #171a18)" text-anchor="middle" font-weight="400">18</text><text x="430.0" y="218.0" font-size="14" fill="var(--muted-foreground, #625f59)" text-anchor="middle" font-weight="400">Easier week</text></svg>