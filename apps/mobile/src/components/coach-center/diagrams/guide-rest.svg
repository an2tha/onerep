<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" role="img" aria-labelledby="guide-rest-title guide-rest-desc" style="font-family:var(--font-sans, sans-serif)"><title id="guide-rest-title">Three sets, two recovery intervals</title><desc id="guide-rest-desc">Session structure only. Block widths do not prescribe a particular work-to-rest ratio.</desc><line x1="96.0" y1="120" x2="108.0" y2="120" stroke="var(--divider, #d8d7d2)" stroke-width="1.5" /><rect x="20.0" y="82" width="76.0" height="82" rx="7" fill="var(--surface-panel, #fbfaf7)" stroke="var(--divider, #d8d7d2)"/><text x="58.0" y="126.0" font-size="15" fill="var(--accent-workout, #5b5bd6)" text-anchor="middle" font-weight="400">Set 1</text><line x1="184.0" y1="120" x2="196.0" y2="120" stroke="var(--divider, #d8d7d2)" stroke-width="1.5" /><rect x="108.0" y="82" width="76.0" height="82" rx="7" fill="var(--surface-panel, #fbfaf7)" stroke="var(--divider, #d8d7d2)"/><text x="146.0" y="126.0" font-size="15" fill="var(--foreground, #171a18)" text-anchor="middle" font-weight="400">Rest</text><line x1="272.0" y1="120" x2="284.0" y2="120" stroke="var(--divider, #d8d7d2)" stroke-width="1.5" /><rect x="196.0" y="82" width="76.0" height="82" rx="7" fill="var(--surface-panel, #fbfaf7)" stroke="var(--divider, #d8d7d2)"/><text x="234.0" y="126.0" font-size="15" fill="var(--foreground, #171a18)" text-anchor="middle" font-weight="400">Set 2</text><line x1="360.0" y1="120" x2="372.0" y2="120" stroke="var(--divider, #d8d7d2)" stroke-width="1.5" /><rect x="284.0" y="82" width="76.0" height="82" rx="7" fill="var(--surface-panel, #fbfaf7)" stroke="var(--divider, #d8d7d2)"/><text x="322.0" y="126.0" font-size="15" fill="var(--foreground, #171a18)" text-anchor="middle" font-weight="400">Rest</text><rect x="372.0" y="82" width="76.0" height="82" rx="7" fill="var(--surface-panel, #fbfaf7)" stroke="var(--divider, #d8d7d2)"/><text x="410.0" y="126.0" font-size="15" fill="var(--foreground, #171a18)" text-anchor="middle" font-weight="400">Set 3</text><text x="240" y="206" font-size="13" fill="var(--muted-foreground, #625f59)" text-anchor="middle" font-weight="400">Order shown; durations not to scale</text></svg>