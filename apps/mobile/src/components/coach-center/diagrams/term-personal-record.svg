<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" role="img" aria-labelledby="term-personal-record-title term-personal-record-desc" style="font-family:var(--font-sans, sans-serif)"><title id="term-personal-record-title">Personal record</title><desc id="term-personal-record-desc">A best set of ten at a fixed movement standard is a rep-specific record.</desc><line x1="154.66666666666666" y1="120" x2="166.66666666666666" y2="120" stroke="var(--divider, #d8d7d2)" stroke-width="1.5" /><rect x="20.0" y="82" width="134.66666666666666" height="82" rx="7" fill="var(--surface-panel, #fbfaf7)" stroke="var(--divider, #d8d7d2)"/><text x="87.33333333333333" y="126.0" font-size="17" fill="var(--accent-workout, #5b5bd6)" text-anchor="middle" font-weight="400">Defined task</text><line x1="301.3333333333333" y1="120" x2="313.3333333333333" y2="120" stroke="var(--divider, #d8d7d2)" stroke-width="1.5" /><rect x="166.66666666666666" y="82" width="134.66666666666666" height="82" rx="7" fill="var(--surface-panel, #fbfaf7)" stroke="var(--divider, #d8d7d2)"/><text x="234.0" y="115.5" font-size="17" fill="var(--foreground, #171a18)" text-anchor="middle" font-weight="400">Comparable</text><text x="234.0" y="136.5" font-size="17" fill="var(--foreground, #171a18)" text-anchor="middle" font-weight="400">standard</text><rect x="313.3333333333333" y="82" width="134.66666666666666" height="82" rx="7" fill="var(--surface-panel, #fbfaf7)" stroke="var(--divider, #d8d7d2)"/><text x="380.66666666666663" y="115.5" font-size="17" fill="var(--foreground, #171a18)" text-anchor="middle" font-weight="400">Best recorded</text><text x="380.66666666666663" y="136.5" font-size="17" fill="var(--foreground, #171a18)" text-anchor="middle" font-weight="400">result</text><text x="240" y="208" font-size="13" fill="var(--muted-foreground, #625f59)" text-anchor="middle" font-weight="400">Concept diagram</text></svg>