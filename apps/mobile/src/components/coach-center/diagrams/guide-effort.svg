<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" role="img" aria-labelledby="guide-effort-title guide-effort-desc" style="font-family:var(--font-sans, sans-serif)"><title id="guide-effort-title">A common strength RPE / RIR convention</title><desc id="guide-effort-desc">Approximate reporting convention, not an exact conversion or a general cardio exertion scale.</desc><rect x="24.0" y="62" width="102.0" height="104" rx="7" fill="var(--surface-panel, #fbfaf7)" stroke="var(--divider, #d8d7d2)"/><text x="75.0" y="94.0" font-size="16" fill="var(--foreground, #171a18)" text-anchor="middle" font-weight="400">RPE 7</text><text x="75.0" y="140.0" font-size="15" fill="var(--accent-workout, #5b5bd6)" text-anchor="middle" font-weight="400">~3 RIR</text><rect x="132.0" y="62" width="102.0" height="104" rx="7" fill="var(--surface-panel, #fbfaf7)" stroke="var(--divider, #d8d7d2)"/><text x="183.0" y="94.0" font-size="16" fill="var(--foreground, #171a18)" text-anchor="middle" font-weight="400">RPE 8</text><text x="183.0" y="140.0" font-size="15" fill="var(--accent-workout, #5b5bd6)" text-anchor="middle" font-weight="400">~2 RIR</text><rect x="240.0" y="62" width="102.0" height="104" rx="7" fill="var(--surface-panel, #fbfaf7)" stroke="var(--divider, #d8d7d2)"/><text x="291.0" y="94.0" font-size="16" fill="var(--foreground, #171a18)" text-anchor="middle" font-weight="400">RPE 9</text><text x="291.0" y="140.0" font-size="15" fill="var(--accent-workout, #5b5bd6)" text-anchor="middle" font-weight="400">~1 RIR</text><rect x="348.0" y="62" width="102.0" height="104" rx="7" fill="var(--surface-panel, #fbfaf7)" stroke="var(--divider, #d8d7d2)"/><text x="399.0" y="94.0" font-size="16" fill="var(--foreground, #171a18)" text-anchor="middle" font-weight="400">RPE 10</text><text x="399.0" y="140.0" font-size="15" fill="var(--accent-workout, #5b5bd6)" text-anchor="middle" font-weight="400">0 RIR</text></svg>