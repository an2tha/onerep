<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" role="img" aria-labelledby="guide-logging-title guide-logging-desc" style="font-family:var(--font-sans, sans-serif)"><title id="guide-logging-title">A useful strength-set record</title><desc id="guide-logging-desc">A record structure, not a claim that every field is required for every set.</desc><line x1="118.0" y1="120" x2="130.0" y2="120" stroke="var(--divider, #d8d7d2)" stroke-width="1.5" /><rect x="20.0" y="82" width="98.0" height="82" rx="7" fill="var(--surface-panel, #fbfaf7)" stroke="var(--divider, #d8d7d2)"/><text x="69.0" y="115.5" font-size="15" fill="var(--accent-workout, #5b5bd6)" text-anchor="middle" font-weight="400">Exercise +</text><text x="69.0" y="136.5" font-size="15" fill="var(--accent-workout, #5b5bd6)" text-anchor="middle" font-weight="400">setup</text><line x1="228.0" y1="120" x2="240.0" y2="120" stroke="var(--divider, #d8d7d2)" stroke-width="1.5" /><rect x="130.0" y="82" width="98.0" height="82" rx="7" fill="var(--surface-panel, #fbfaf7)" stroke="var(--divider, #d8d7d2)"/><text x="179.0" y="126.0" font-size="15" fill="var(--foreground, #171a18)" text-anchor="middle" font-weight="400">Load + reps</text><line x1="338.0" y1="120" x2="350.0" y2="120" stroke="var(--divider, #d8d7d2)" stroke-width="1.5" /><rect x="240.0" y="82" width="98.0" height="82" rx="7" fill="var(--surface-panel, #fbfaf7)" stroke="var(--divider, #d8d7d2)"/><text x="289.0" y="115.5" font-size="15" fill="var(--foreground, #171a18)" text-anchor="middle" font-weight="400">Effort +</text><text x="289.0" y="136.5" font-size="15" fill="var(--foreground, #171a18)" text-anchor="middle" font-weight="400">rest</text><rect x="350.0" y="82" width="98.0" height="82" rx="7" fill="var(--surface-panel, #fbfaf7)" stroke="var(--divider, #d8d7d2)"/><text x="399.0" y="115.5" font-size="15" fill="var(--foreground, #171a18)" text-anchor="middle" font-weight="400">Relevant</text><text x="399.0" y="136.5" font-size="15" fill="var(--foregro