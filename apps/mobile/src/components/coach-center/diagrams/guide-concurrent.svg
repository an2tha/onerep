<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" role="img" aria-labelledby="guide-concurrent-title guide-concurrent-desc" style="font-family:var(--font-sans, sans-serif)"><title id="guide-concurrent-title">An example mixed-training week</title><desc id="guide-concurrent-desc">A scheduling example, not a universal split or intensity prescription.</desc><text x="47" y="75" font-size="14" fill="var(--muted-foreground, #625f59)" text-anchor="middle" font-weight="400">Mon</text><rect x="18" y="95" width="58" height="66" rx="7" fill="var(--surface-panel, #fbfaf7)" stroke="var(--accent-workout, #5b5bd6)"/><text x="47" y="135" font-size="14" fill="var(--accent-workout, #5b5bd6)" text-anchor="middle" font-weight="400">Lift</text><text x="111" y="75" font-size="14" fill="var(--muted-foreground, #625f59)" text-anchor="middle" font-weight="400">Tue</text><rect x="82" y="95" width="58" height="66" rx="7" fill="var(--surface-panel, #fbfaf7)" stroke="var(--accent-workout, #5b5bd6)"/><text x="111" y="135" font-size="14" fill="var(--accent-workout, #5b5bd6)" text-anchor="middle" font-weight="400">Ride</text><text x="175" y="75" font-size="14" fill="var(--muted-foreground, #625f59)" text-anchor="middle" font-weight="400">Wed</text><rect x="146" y="95" width="58" height="66" rx="7" fill="var(--surface-panel, #fbfaf7)" stroke="var(--divider, #d8d7d2)"/><text x="175" y="135" font-size="14" fill="var(--muted-foreground, #625f59)" text-anchor="middle" font-weight="400">Rest</text><text x="239" y="75" font-size="14" fill="var(--muted-foreground, #625f59)" text-anchor="middle" font-weight="400">Thu</text><rect x="210" y="95" width="58" height="66" rx="7" fill="var(--surface-panel, #fbfaf7)" stroke="var(--accent-workout, #5b5bd6)"/><text x="239" y="135" font-size="14" fill="var(--accent-workout, #5b5bd6)" text-anchor="middle" font-weight="400">Lift</text><text x="303" y="75" font-size="14" fill="var(--muted-foreground, #625f59)" text-anchor="middle" font-weight="400">Fri</text>