<!doctype html><html><head><meta charset="utf-8"><style>
:root{--background:#0c0c0c;--foreground:#f4f2ef;--muted-foreground:#9a938c;--border:#2a2724;--muted:#232019}
.light{--background:#f5f3f0;--foreground:#14110f;--muted-foreground:#8a827a;--border:#ddd8d0;--muted:#e5e1db}
body{margin:0;background:#000;font-family:-apple-system,Inter,sans-serif}
.s{position:relative;width:393px;height:620px;overflow:hidden;background:var(--background)}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--background);border-top-left-radius:22px;border-top-right-radius:22px;border-top:1px solid var(--border);color:var(--foreground)}
.grab{height:44px;display:flex;align-items:center;justify-content:center}
.grab i{width:36px;height:5px;border-radius:99px;background:color-mix(in srgb,var(--foreground) 22%,transparent)}
.b{padding:0 1.25rem 1.5rem}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;padding-bottom:.25rem}
.hd h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.hd p{margin:.25rem 0 0;font-size:13px;line-height:1.4;color:var(--muted-foreground)}
.x{width:44px;height:44px;border-radius:99px;border:0;background:none;color:var(--muted-foreground);font-size:17px;margin:-.25rem -.5rem 0 0}
.list{margin-top:1rem;border-top:1px solid color-mix(in srgb,var(--border) 60%,transparent);border-bottom:1px solid color-mix(in srgb,var(--border) 60%,transparent)}
.r{display:flex;align-items:center;gap:.5rem;min-height:64px;padding:.5rem 0;border-bottom:1px solid color-mix(in srgb,var(--border) 60%,transparent)}
.r:last-child{border-bottom:0}
.mv{display:flex;flex-direction:column;flex-shrink:0}
.mv button{height:24px;width:32px;border:0;background:none;color:var(--muted-foreground);font-size:11px;border-radius:6px}
.mv button.off{opacity:.2}
.nm{flex:1;min-width:0}
.nm p{margin:0;font-size:15px;font-weight:600}
.nm p.d{margin-top:2px;font-size:12px;font-weight:400;color:var(--muted-foreground)}
.nm p.dim{color:var(--muted-foreground)}
.ic{width:44px;height:44px;border-radius:99px;border:0;background:none;color:var(--muted-foreground);flex-shrink:0;font-size:15px}
.ic.on{background:var(--muted);color:var(--foreground)}
</style></head><body>
<div class="s"><div class="dim"></div><div class="sheet">
 <div class="grab"><i></i></div>
 <div class="b">
  <div class="hd"><div><h2>Customize dashboard</h2><p>Reorder, resize, hide, or pin the sections below the hero.</p></div><button class="x">✕</button></div>
  <div class="list">
   <div class="r"><div class="mv"><button class="off">▲</button><button>▼</button></div>
    <div class="nm"><p>Progress snapshot</p><p class="d">Full width</p></div>
    <button class="ic">⇕</button><button class="ic">⚲</button><button class="ic">◉</button></div>
   <div class="r"><div class="mv"><button>▲</button><button>▼</button></div>
    <div class="nm"><p>Coach goals</p><p class="d">Compact · Pinned</p></div>
    <button class="ic on">⇕</button><button class="ic on">⚲</button><button class="ic">◉</button></div>
   <div class="r"><div class="mv"><button>▲</button><button class="off">▼</button></div>
    <div class="nm"><p class="dim">This week's plan</p><p class="d">Hidden</p></div>
    <button class="ic">⇕</button><button class="ic">⚲</button><button class="ic on">◎</button></div>
  </div>
 </div>
</div></div></body></html>
