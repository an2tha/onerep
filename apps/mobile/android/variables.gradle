ext {
    // 26, not 24: the Health Connect client SDK requires API 26. Android 8.0 is
    // 2017 hardware; the health import is a headline feature and gating it at
    // runtime instead would mean two code paths for a rounding-error audience.
    minSdkVersion = 26
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'

    // Native parity additions.
    androidxHealthConnectVersion = '1.1.0-rc02'
    androidxGlanceVersion = '1.1.1'
    androidxComposeBomVersion = '2025.04.01'
    kotlinxCoroutinesVersion = '1.10.2'
}
