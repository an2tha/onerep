apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace = "com.ananthh.onerep"
    compileSdk = rootProject.ext.compileSdkVersion
    // Pinned rather than inherited. The CMake build below needs an NDK, and
    // without a version here Gradle takes whatever the machine happens to have
    // — which on a CI runner is whatever that week's image shipped. A runner
    // bump would then surface as a link error in needle_jni.c, which reads
    // like our bug rather than a toolchain that moved underneath us.
    ndkVersion = "27.0.12077973"
    defaultConfig {
        applicationId "com.ananthh.onerep"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        // Semver, because CapacitorUpdater.current().native feeds the
        // minNativeVersion gate in src/lib/ota-manifest.ts. "1.0" does not parse.
        versionName "1.1.6"
        // CI has its own counter and no way to commit a bump, so it stamps
        // over the literals above. The literals stay literal because
        // scripts/generate-release.local.sh rewrites them with sed.
        if (project.hasProperty('onerepVersionCode')) {
            versionCode project.onerepVersionCode.toInteger()
        }
        if (project.hasProperty('onerepVersionName')) {
            versionName project.onerepVersionName
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // The Needle 2 engine ships as a static archive per ABI, and arm64 is
        // the only one we can link. Anything else has no libneedle.a, so the
        // NDK build is scoped rather than left to fail on x86 emulators.
        //
        // armeabi-v7a is gone on purpose. Its archive was compiled against the
        // libc++ in NDK 30.0.14904198 — a preview release — and references
        // std::__ndk1::__hash_memory, which no stable NDK defines: not the 27
        // pinned below, not 29. (The arm64 slice never references it, which is
        // why only the 32-bit link broke.) Putting it back means rebuilding
        // that archive upstream against the NDK this project pins, not
        // widening the filter here.
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing is driven by properties so no keystore or password is ever
    // committed. Supply them via ~/.gradle/gradle.properties or -P flags:
    //   onerepStoreFile, onerepStorePassword, onerepKeyAlias, onerepKeyPassword
    // With none set, `assembleRelease` falls back to the debug signing config so
    // a local release build still runs.
    signingConfigs {
        release {
            def storePath = project.findProperty('onerepStoreFile')
            if (storePath) {
                storeFile file(storePath)
                storePassword project.findProperty('onerepStorePassword')
                keyAlias project.findProperty('onerepKeyAlias')
                keyPassword project.findProperty('onerepKeyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig project.hasProperty('onerepStoreFile')
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }

    buildFeatures {
        compose true
    }

    // libneedlejni.so: the JNI shim in src/main/cpp that Kotlin can actually
    // call, linked against the fetched libneedle.a. See needle_jni.c.
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    kotlinOptions {
        // Must match the Java target in capacitor.build.gradle.
        jvmTarget = '21'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // --- Native parity ---
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlinxCoroutinesVersion"
    // Health Connect: the Android counterpart of the HealthKit import.
    implementation "androidx.health.connect:connect-client:$androidxHealthConnectVersion"
    // Glance: the Android counterpart of the WidgetKit extension.
    implementation "androidx.glance:glance-appwidget:$androidxGlanceVersion"
    implementation "androidx.glance:glance-material3:$androidxGlanceVersion"
    implementation platform("androidx.compose:compose-bom:$androidxComposeBomVersion")
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
