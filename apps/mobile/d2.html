<!doctype html><html><head><meta charset="utf-8"><style>
:root{--background:#0c0c0c;--foreground:#f4f2ef;--muted-foreground:#9a938c;--accent-food:#d2691e;--app-page-x:1.25rem}
.light{--background:#f5f3f0;--foreground:#14110f;--muted-foreground:#8a827a;--accent-food:#c9a227}
body{margin:0;background:var(--background);font-family:-apple-system,Inter,sans-serif;color:var(--foreground)}
.root{position:relative;isolation:isolate;min-height:100vh;background:var(--background);padding-bottom:2rem}
.wash{position:absolute;z-index:0;top:0;right:0;left:0;height:min(38rem,68svh);pointer-events:none;
background:
 radial-gradient(115% calc(52% + var(--hero-fill,0)*.16%) at 50% 34%, color-mix(in srgb,var(--accent-food) calc(13% + var(--hero-fill,0)*.08%),transparent) 0%, transparent 74%),
 radial-gradient(74% 46% at 12% 6%, color-mix(in srgb,var(--foreground) 6%,transparent) 0%, transparent 78%);
-webkit-mask-image:linear-gradient(180deg,#000 0%,#000 46%,transparent 100%);
mask-image:linear-gradient(180deg,#000 0%,#000 46%,transparent 100%)}
.root>*:not(.wash){position:relative;z-index:1}
.page{width:100%;max-width:38rem;margin:0 auto;padding:0 var(--app-page-x)}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;padding-top:1.5rem;padding-bottom:1.25rem}
.t{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;margin:0}
.hda{display:flex;gap:1rem;align-items:center;color:var(--foreground)}
.hda i{width:22px;height:22px;border:2px solid currentColor;border-radius:4px;display:block;opacity:.9}
.hero{position:relative;padding:.25rem 0 .5rem;text-align:center}
.kcal{display:flex;align-items:baseline;justify-content:center;gap:.375rem;margin:0}
.kcal b{font-size:3.25rem;line-height:1;font-weight:800;letter-spacing:-.02em}
.kcal s{text-decoration:none;font-size:1.05rem;font-weight:600;color:var(--muted-foreground)}
.sub{margin:.375rem 0 0;font-size:13px;color:var(--muted-foreground)}
.dials{position:relative;margin-top:1.25rem;display:flex;align-items:center;justify-content:center;padding-bottom:.25rem}
.d{position:relative;flex-shrink:0;border-radius:9999px;box-shadow:0 0 0 4px var(--background)}
.d svg{height:100%;width:100%;transform:rotate(-90deg);display:block}
.inner{position:absolute;inset:18%;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.v{margin:0;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
.lab{margin:.25rem 0 0;line-height:1.15;color:var(--muted-foreground)}
.lab2{margin:0;line-height:1.15;font-size:11px;color:color-mix(in srgb,var(--muted-foreground) 80%,transparent);font-variant-numeric:tabular-nums}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-top:1rem}
.act{display:flex;flex-direction:column;align-items:center;gap:.5rem;font-size:13px;font-weight:600}
.act i{display:block;height:3.5rem;width:3.5rem;border-radius:9999px;border:1px solid color-mix(in srgb,var(--foreground) 14%,transparent);background:color-mix(in srgb,var(--foreground) 5%,transparent)}
.sec{border-top:1px solid color-mix(in srgb,var(--foreground) 12%,transparent);margin-top:1.25rem;padding-top:.75rem}
.sec h3{font-size:13px;color:var(--muted-foreground);margin:0 0 .5rem;font-weight:700}
.item{display:flex;justify-content:space-between;padding:.5rem 0;font-size:15px}
.item small{display:block;color:var(--muted-foreground);font-size:12.5px;margin-top:2px}
</style></head><body>
<div class="root" style="--hero-fill:34" id="root">
 <span class="wash"></span>
 <div class="page">
  <div class="hd"><h1 class="t">Nutrition</h1><div class="hda"><i></i><i></i><i style="border-radius:50%"></i></div></div>
  <div class="hero">
    <p class="kcal"><b>1,848</b><s>kcal left</s></p>
    <p class="sub">944 of 2,792 kcal · 2 entries</p>
    <div class="dials" id="dials"></div>
  </div>
  <div class="actions"><div class="act"><i></i>Search</div><div class="act"><i></i>Barcode</div><div class="act"><i></i>Snap</div><div class="act"><i></i>Describe</div></div>
  <div class="sec"><h3>Intake</h3>
    <div class="item"><span>Pasta bolognese<small>12:40</small></span><b>620 kcal</b></div>
    <div class="item"><span>Protein shake<small>10:15</small></span><b>324 kcal</b></div>
  </div>
 </div>
</div>
<script>
const R=44,C=2*Math.PI*R;
function dial({value,target,suffix,color,size,stroke,emph,name}){
  const f=Math.min(1,value/target);
  return `<div class="d" style="width:${size}px;height:${size}px">
   <svg viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="${R}" fill="var(--background)" stroke="var(--foreground)" stroke-opacity=".08" stroke-width="${stroke}"/>
    <circle cx="50" cy="50" r="${R}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-f)}"/>
   </svg>
   <div class="inner">
     <p class="v" style="font-size:${emph?'2rem':'1.15rem'}">${value.toLocaleString()}<span style="color:${color};font-weight:700;font-size:${emph?'15px':'12px'}">${suffix}</span></p>
     <p class="lab" style="font-size:${emph?'12px':'11px'}">${name}</p>
     ${emph?`<p class="lab2">of ${target}${suffix}</p>`:''}
   </div></div>`;
}
document.getElementById('dials').innerHTML =
  dial({value:944,target:2792,suffix:'',color:'#d2691e',size:104,stroke:7,emph:false,name:'Calories'})
+ dial({value:64,target:143,suffix:'g',color:'#e0632a',size:158,stroke:8,emph:true,name:'Protein'})
+ dial({value:24,target:87,suffix:'g',color:'#b45bc9',size:104,stroke:7,emph:false,name:'Fat'});
const d=document.querySelectorAll('.d');
d[0].style.marginRight='-0.875rem';d[0].style.zIndex=0;
d[1].style.zIndex=10;
d[2].style.marginLeft='-0.875rem';d[2].style.zIndex=0;
</script></body></html>
