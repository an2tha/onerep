services:
  data-api:
    build:
      context: ./apps/data-api
      dockerfile: Dockerfile
    container_name: onerep-data-api
    environment:
      NODE_ENV: development
      PORT: "3000"
      FOOD_INDEX_PATH: /data/food-index.sqlite
      DATABASE_URL: ${DATABASE_URL:-}
    ports:
      - "${DATA_API_PORT:-3001}:3000"
    volumes:
      - ./apps/data-api/data:/data:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
